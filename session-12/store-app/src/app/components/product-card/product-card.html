<article class="overflow-hidden rounded-2xl bg-white shadow-lg transition hover:shadow-xl">
  <img [src]="product.img" [alt]="product.name" class="h-56 w-full object-cover" />

  <div class="p-5">
    <h2 class="text-2xl font-bold text-gray-800">{{ product.name }}</h2>
    <p class="mt-3 text-gray-600">Price: <span class="font-semibold text-blue-600">{{ product.price }} EGP</span></p>
    <p class="text-gray-600">Quantity: <span class="font-semibold">{{ product.quantity }}</span></p>

    @switch (product.quantity) {
      @case (0) { <p class="mt-2 font-semibold text-red-600">Out of stock</p> }
      @case (1) { <p class="mt-2 font-semibold text-amber-600">Last one item!</p> }
      @case (2) { <p class="mt-2 font-semibold text-amber-600">Last two items!</p> }
      @default { <p class="mt-2 font-semibold text-green-600">In stock</p> }
    }

    <button
      type="button"
      (click)="buy()"
      [disabled]="product.quantity === 0"
      class="mt-5 w-full rounded-lg bg-blue-600 py-2 text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-gray-400">
      Buy
    </button>
  </div>
</article>
